<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dulces Sueños Blanquería — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="evento-confeti" id="eventoConfeti"></div>
<div class="evento-overlay" id="eventoOverlay">
  <div class="evento-box">
    <button class="evento-close" onclick="cerrarEvento()" aria-label="Cerrar">×</button>
    <img id="eventoImg" class="evento-img" src="" alt="">
    <h2 id="eventoTitulo"></h2>
    <p id="eventoMensaje"></p>
    <div class="evento-botones" id="eventoBotones">
      <button type="button" class="contact-link" onclick="cerrarEvento()" id="eventoBtnContinuar">Continuar</button>
      <a href="#" class="contact-link" id="eventoBtnPromo" style="display:none;">Ver promociones</a>
    </div>
  </div>
</div>

<header class="cat-header">
  <h1 class="cat-title">Dulces Sueños</h1>
  <p class="subtitle">Blanquería</p>
  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar producto...">
    </div>
    <div class="chip-row" id="chipRow"></div>
    <button type="button" class="chip contact-btn" onclick="openContact()">✉️ Contacto</button>
  </div>
</header>

<main>
  <div id="content">
    <div class="state">
      <div class="dot-loader"><span></span><span></span><span></span></div>
      <h2>Un momento</h2>
      <p>Trayendo los productos desde la planilla…</p>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeDetail()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeDetail()" aria-label="Cerrar">×</button>
    <div class="modal-image"><img id="modalImg" src="" alt=""></div>
    <div class="modal-info">
      <p class="category" id="modalCategory"></p>
      <h2 id="modalName"></h2>
      <p class="desc" id="modalDesc"></p>
      <div class="modal-price" id="modalPrice"></div>
      <div class="modal-selects">
        <label id="modalColorWrap" style="display:none">
          Color
          <select id="modalColorSelect"></select>
        </label>
        <label id="modalSizeWrap" style="display:none">
          Talle
          <select id="modalSizeSelect"></select>
        </label>
      </div>
      <div class="modal-stock" id="modalStock"></div>
      <button type="button" class="contact-link" id="modalWhatsappBtn" onclick="sendWhatsappConsulta()">💬 Consultar por WhatsApp</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="contactOverlay" onclick="if(event.target===this) closeContact()">
  <div class="modal-box contact-box">
    <button class="modal-close" onclick="closeContact()" aria-label="Cerrar">×</button>
    <div class="modal-info">
      <img src="logo-catalogo.png" alt="Logo" class="contact-logo">
      <p class="category">Contacto</p>
      <h2>Escribinos</h2>
      <p class="desc" id="contactHorario"></p>
      <div class="contact-links">
        <a id="contactEmailLink" class="contact-link" href="#">✉️ Enviar email</a>
        <a id="contactWhatsappLink" class="contact-link" href="#" target="_blank" rel="noopener">💬 Escribir por WhatsApp</a>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
